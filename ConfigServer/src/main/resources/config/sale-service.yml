server:
  port: ${PORT:8083}
  wait-time-in-ms-when-sync-empty: 3000

spring:
  application:
    name: sale-service

  mongodb:
    host: ${MONGODB_HOST:localhost}
    port: 27017
    database: sale_db
    auto-index-creation: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${DISCOVERY_HOST:discovery-service}:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  version: 1.0
